<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoodCheck — diagnosi fotocamera</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px calc(40px + env(safe-area-inset-bottom));
    background: #0E0E14; color: #F4F4F7;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 20px; letter-spacing: -.02em; margin: 0 0 6px; }
  p.sotto { color: #A8A8B6; font-size: 13.5px; margin: 0 0 20px; }
  button {
    font: 600 16px/1 inherit; width: 100%; padding: 16px; margin-bottom: 12px;
    border: 0; border-radius: 12px; background: #7B7BFF; color: #0A0A12; cursor: pointer;
  }
  button.secondario { background: #1F1F27; color: #F4F4F7; border: 1px solid rgba(255,255,255,.16); }
  pre {
    background: #16161E; border: 1px solid rgba(255,255,255,.1); border-radius: 12px;
    padding: 14px; font: 12px/1.55 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word; margin: 0 0 12px;
  }
  video { width: 100%; border-radius: 12px; background: #000; margin-bottom: 12px; display: none; }
  video.visibile { display: block; }
  .ok { color: #35C77C; }
  .ko { color: #FF6250; }
</style>
</head>
<body>

<h1>Diagnosi fotocamera</h1>
<p class="sotto">Questa pagina non usa React né la logica dell’app: chiama la fotocamera nel modo più semplice possibile e scrive quello che il browser risponde.</p>

<button id="chiedi">Chiedi la fotocamera</button>
<button id="copia" class="secondario">Copia il risultato</button>

<video id="anteprima" playsinline muted></video>
<pre id="esito">…</pre>

<script>
(function () {
  var righe = []
  var esito = document.getElementById('esito')
  var video = document.getElementById('anteprima')

  function scrivi(testo) {
    righe.push(testo)
    esito.textContent = righe.join('\n')
  }

  function ambiente() {
    var nav = window.navigator
    scrivi('AMBIENTE')
    scrivi('  browser      ' + nav.userAgent)
    scrivi('  indirizzo    ' + location.href)
    scrivi('  sicuro       ' + window.isSecureContext)
    scrivi('  da icona     ' + (nav.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)))
    scrivi('  mediaDevices ' + (nav.mediaDevices ? 'presente' : 'ASSENTE'))
    scrivi('  getUserMedia ' + (nav.mediaDevices && nav.mediaDevices.getUserMedia ? 'presente' : 'ASSENTE'))
    scrivi('  permissions  ' + (nav.permissions && nav.permissions.query ? 'presente' : 'assente'))
    scrivi('  schermo      ' + screen.width + '×' + screen.height + ' @' + (window.devicePixelRatio || 1) + 'x')
    scrivi('')

    if (nav.permissions && nav.permissions.query) {
      nav.permissions.query({ name: 'camera' }).then(function (p) {
        scrivi('permesso dichiarato: ' + p.state)
      }).catch(function (e) {
        scrivi('permesso dichiarato: non interrogabile (' + e.name + ')')
      })
    }

    if (nav.mediaDevices && nav.mediaDevices.enumerateDevices) {
      nav.mediaDevices.enumerateDevices().then(function (elenco) {
        var video = elenco.filter(function (d) { return d.kind === 'videoinput' })
        scrivi('fotocamere viste: ' + video.length + (video.length ? ' (nomi visibili solo dopo il permesso)' : ''))
      }).catch(function (e) {
        scrivi('elenco dispositivi: errore ' + e.name)
      })
    }
  }

  function prova(nome, vincoli) {
    var inizio = Date.now()
    scrivi('')
    scrivi('TENTATIVO: ' + nome)
    return navigator.mediaDevices.getUserMedia(vincoli).then(function (flusso) {
      var t = Date.now() - inizio
      var traccia = flusso.getVideoTracks()[0]
      var s = traccia && traccia.getSettings ? traccia.getSettings() : {}
      scrivi('  RIUSCITO dopo ' + t + ' ms')
      scrivi('  fotocamera: ' + (traccia ? traccia.label || '(senza nome)' : 'nessuna traccia'))
      scrivi('  risoluzione: ' + (s.width || '?') + '×' + (s.height || '?'))
      esito.innerHTML = esito.textContent
      video.srcObject = flusso
      video.className = 'visibile'
      video.play().catch(function (e) { scrivi('  play(): rifiutato — ' + e.name) })
      return true
    }).catch(function (e) {
      var t = Date.now() - inizio
      scrivi('  FALLITO dopo ' + t + ' ms')
      scrivi('  ' + e.name + ': ' + e.message)
      return false
    })
  }

  document.getElementById('chiedi').addEventListener('click', function () {
    righe = []
    esito.textContent = ''
    ambiente()

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      scrivi('')
      scrivi('Questo browser non espone getUserMedia: la fotocamera non è raggiungibile.')
      return
    }

    // Un limite di tempo esplicito: se il browser non risponde né sì né no,
    // deve risultare, non restare in attesa muta.
    var scaduto = setTimeout(function () {
      scrivi('')
      scrivi('NESSUNA RISPOSTA dopo 15 secondi: il browser non ha né concesso né negato.')
    }, 15000)

    prova('fotocamera posteriore, alta risoluzione', {
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(function (ok) {
      if (ok) { clearTimeout(scaduto); return }
      return prova('fotocamera posteriore, senza altre pretese', {
        video: { facingMode: 'environment' }, audio: false
      }).then(function (ok2) {
        if (ok2) { clearTimeout(scaduto); return }
        return prova('una fotocamera qualsiasi', { video: true, audio: false }).then(function () {
          clearTimeout(scaduto)
        })
      })
    })
  })

  document.getElementById('copia').addEventListener('click', function () {
    var testo = esito.textContent
    if (navigator.clipboard) {
      navigator.clipboard.writeText(testo).then(function () {
        scrivi('')
        scrivi('(copiato negli appunti)')
      })
    } else {
      var s = document.createRange()
      s.selectNodeContents(esito)
      window.getSelection().removeAllRanges()
      window.getSelection().addRange(s)
    }
  })

  ambiente()
})()
</script>
</body>
</html>
